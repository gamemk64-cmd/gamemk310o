<!DOCTYPE html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<script>/* Android-слой: отдельные файлы, грузятся только на Android */
if(/Android/i.test(navigator.userAgent)){document.documentElement.classList.add('android');
document.write('<link rel="stylesheet" href="android/android.css">')}</script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/adaptive.js"></script>
</head><body>
<div id="bgart"></div>
<div id="amb"></div>
<aside id="side"><h1>Music Player</h1><div id="nav"></div>
<button class="add" id="b1">Добавить музыку</button><button class="add" id="b2" style="margin-top:6px!important">Добавить папку</button></aside>
<main id="main"></main>
<footer id="pl">
<div id="now"><div class="cv" id="pc">♪</div><div class="tt"><b id="pt">Ничего не играет</b><small id="pa">Добавьте музыку</small></div><button id="pf" title="Избранное">♥</button></div>
<div id="ctl"><div><button id="sh" title="Shuffle">⇄</button><button id="pv" title="Назад">⏮</button><button class="pp" id="pp" title="Play / Pause (Space)">▶</button><button id="nx" title="Вперёд">⏭</button><button id="rp" title="Repeat">↻</button></div>
<div id="sk"><span class="d" id="tc">00:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span class="d" id="td">00:00</span></div></div>
<div id="vol"><span class="chip" id="duckb" style="display:none;margin:0">приглушено</span><button id="mu">🔊</button><input type="range" id="vr" min="0" max="100" aria-label="Громкость"></div>
</footer>
<div id="toast"></div><div id="drop">Отпустите файлы, чтобы добавить</div>
<input type="file" id="fi" accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.opus,audio/*" multiple hidden>
<input type="file" id="fd" webkitdirectory multiple hidden>
<input type="file" id="fc" accept="image/*" hidden>
<div id="ytp" style="position:fixed;left:-320px;bottom:0;width:240px;height:240px;z-index:-1;pointer-events:none;overflow:hidden"><div id="ytf"></div></div>
<audio id="au" preload="auto"></audio>
<script src="js/01-core.js"></script>
<script src="js/02-storage.js"></script>
<script src="js/03-audio.js"></script>
<script src="js/04-ui.js"></script>
<script src="js/05-web.js"></script>
<script src="js/06-youtube.js"></script>
<script src="js/07-beats.js"></script>
<script src="js/08-events.js"></script>
<script src="js/09-vibe.js"></script>
<script src="js/10-init.js"></script>
<script src="js/20-extras.js"></script>
<script src="js/21-ui-settings.js"></script>
<script src="js/22-icons.js"></script>
<script src="js/23-player-buttons.js"></script>
<script src="js/24-profile-media.js"></script>
<script src="js/30-fixes.js"></script>
<script src="js/31-localize.js"></script>
<script src="js/32-app-sense.js"></script>
<script src="js/33-permission-prompt.js"></script>
<script src="android/android.js"></script>
</body></html>
